name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t meraki-api-emulator .
      - name: Smoke test
        run: |
          docker run -d --name emulator -p 8765:8765 meraki-api-emulator
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' emulator)" = healthy ] && break; sleep 1; done
          docker inspect -f '{{.State.Health.Status}}' emulator | grep -x healthy
          curl -fsS -H 'X-Cisco-Meraki-API-Key: ci' http://127.0.0.1:8765/api/v1/organizations
          docker logs emulator

  sdk:
    name: Meraki Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r scripts/sdk-requirements.txt
      - run: python scripts/sdk-check.py
